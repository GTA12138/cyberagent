name: checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chengjian_test
          POSTGRES_PASSWORD: local_ci_test
          POSTGRES_DB: chengjian_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chengjian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHENGJIAN_PG_DSN: postgres://chengjian_test:local_ci_test@127.0.0.1:5432/chengjian_test?sslmode=disable
      CHENGJIAN_CONFIG: /tmp/chengjian-ci-no-runtime-config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 -timeout 180s ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test && npm run build:static
        working-directory: web
