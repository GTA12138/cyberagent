services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chengjian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chengjian}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chengjian} -d ${POSTGRES_DB:-chengjian}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chengjian:
    # 从源码构建二开版镜像(Dockerfile.source 自包含构建:前端+Go+工具层)。
    # 使用本项目源码构建，避免外部镜像覆盖定制实现。
    build:
      context: .
      dockerfile: Dockerfile.source
    image: chengjian:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHENGJIAN_PG_DSN: postgres://${POSTGRES_USER:-chengjian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chengjian}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHENGJIAN_LLM_PROVIDER: ${CHENGJIAN_LLM_PROVIDER:-}
      CHENGJIAN_LLM_MODEL: ${CHENGJIAN_LLM_MODEL:-}
      CHENGJIAN_LLM_BASE_URL: ${CHENGJIAN_LLM_BASE_URL:-}
      CHENGJIAN_LLM_PROXY: ${CHENGJIAN_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
